services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: monitor
      MYSQL_USER: monitor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-monitorpass}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  server:
    build: ./src/Server
    ports:
      - "5000:5000"
    environment:
      MONITOR_API_KEY: ${MONITOR_API_KEY:-dev-secret-key}
      ConnectionStrings__Default: "Server=db;Port=3306;Database=monitor;User ID=monitor;Password=${MYSQL_PASSWORD:-monitorpass}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  agent-pc01:
    build: ./src/Agent
    command: ["pc-01", "sim"]
    environment:
      MONITOR_SERVER_URL: http://server:5000/api/metrics
      MONITOR_API_KEY: ${MONITOR_API_KEY:-dev-secret-key}
    depends_on:
      - server
    restart: unless-stopped

  agent-pc02:
    build: ./src/Agent
    command: ["pc-02", "sim"]
    environment:
      MONITOR_SERVER_URL: http://server:5000/api/metrics
      MONITOR_API_KEY: ${MONITOR_API_KEY:-dev-secret-key}
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mysql-data:
