<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PulseMon</title>
<style>
:root{
  --bg:#000;--ink:#EAF2FF;--sub:#9FB0D0;
  --line:#00D4FF;--line2:#3A5BFF;--title:#6EF2A0;--yellow:#E8D82A;
  --cpu:#B26BFF;--mem:#FFB066;--ok:#5CFF9D;--warn:#FF5C7A;--off:#7A7F8C;--ring:#6C4CFF;
  --kpi:#A9B77A;--grid:#1B2747;
  --glow:0 0 10px #00D4FF66,0 0 22px #00D4FF22,inset 0 0 14px #00D4FF14;
  --r:26px;--gap:16px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:"Pretendard","Malgun Gothic","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45;overflow-x:hidden}

/* 상단 바 */
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 78px 0 24px;position:relative;border-bottom:2px solid var(--line2);box-shadow:0 8px 18px -10px #3A5BFF99}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 6px #7A5CFF)}
.logo span{font-family:"Segoe UI","Pretendard",sans-serif;font-style:italic;font-weight:800;font-size:30px;letter-spacing:-.5px;background:linear-gradient(90deg,#4FA3FF,#A56CFF);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px #4FA3FF88)}
.right{display:flex;align-items:center;gap:14px;color:var(--sub)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:99px;background:#000;border:1px solid var(--line);box-shadow:0 0 8px #00D4FF44;font-size:15px;color:var(--sub)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--off);display:inline-block;flex:none}
.pill.live{color:var(--ink)}.pill.live .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.retry .dot{background:var(--mem)}.pill.off .dot{background:var(--warn)}.pill.poll .dot{background:var(--cpu)}

/* 레이아웃 */
.app{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 72px)}
.side{padding:16px 20px;border-right:2px solid var(--line2);box-shadow:8px 0 18px -10px #3A5BFF99;position:relative}
.side h3{margin:4px 0 14px;font-size:30px;font-weight:600;color:var(--yellow);text-shadow:0 0 8px #E8D82A66;display:flex;justify-content:space-between;align-items:baseline}
.side h3 span{color:var(--sub);font-size:16px;font-weight:400;text-shadow:none}
#q{width:100%;padding:10px 16px;border:2px solid var(--line);border-radius:99px;background:#000;color:var(--ink);font:inherit;text-align:center;box-shadow:var(--glow);margin-bottom:18px}
#q::placeholder{color:var(--sub)}
#q:focus{outline:none;box-shadow:0 0 14px #00D4FFAA,inset 0 0 14px #00D4FF22}
.item{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;cursor:pointer;border:1px solid transparent;font-size:19px}
.item:hover{background:#0B1530}
.item.sel{border-color:#00D4FF55;background:#06101F}
.item .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .p{color:var(--sub);font-variant-numeric:tabular-nums}
.item .star{color:var(--line);font-size:22px;line-height:1;text-shadow:0 0 8px var(--line)}
.item.offline .n,.item.offline .p{opacity:.5}
.st-ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}.st-warn{background:var(--warn);box-shadow:0 0 6px var(--warn)}.st-offline{background:var(--off)}
main{padding:20px 22px;display:grid;gap:var(--gap);align-content:start;min-width:0;position:relative}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}

/* 카드 */
.card{background:#000;border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--glow);min-width:0;overflow:hidden}
.ch{display:flex;justify-content:center;align-items:baseline;gap:10px;padding:10px 14px 8px;border-bottom:1px solid var(--line2);font-weight:500;font-size:28px;color:var(--title);text-shadow:0 0 8px #6EF2A044}
.ch small{color:var(--sub);font-weight:400;font-size:14px;text-shadow:none}
.cb{padding:14px 18px}
.empty{color:var(--sub);text-align:center;padding:22px 0}
.donut{display:flex;align-items:center;gap:18px}
.lg{flex:1}
.lg div{display:flex;align-items:center;gap:8px;margin:5px 0;color:var(--sub)}
.lg b{color:var(--ink);margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}
.lg .al{margin-top:10px;padding-top:8px;border-top:1px dashed var(--grid)}
.topn .t{display:grid;grid-template-columns:78px 1fr 52px;gap:10px;align-items:center;margin:9px 0;font-size:15px;font-weight:600;cursor:pointer}
.topn .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topn .t span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:10px;background:#0D0D14;border:1px solid #E8ECFF88;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.sel-card .cb{padding:16px 18px 18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.kpi{background:#000;border:2px solid var(--kpi);border-radius:22px;padding:14px 12px;text-align:center;box-shadow:0 0 10px #A9B77A33}
.kpi .l{color:var(--ink);font-size:17px}
.kpi .v{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:8px;color:#EDEDED;text-shadow:0 0 10px #FFFFFF55}
svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse}
th{font-size:15px;color:var(--sub);text-align:left;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line2)}
td{padding:9px 12px;border-bottom:1px solid #101a33;font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right}
.tag{display:inline-block;padding:1px 10px;border-radius:6px;background:#FF5C7A33;border:1px solid var(--warn);color:#FFD0D8;font-size:14px;font-weight:600}
.scroll{max-height:260px;overflow:auto}
.chart-box{padding:10px 14px 14px}

/* 반짝이 장식 */
.spark{position:absolute;pointer-events:none;width:64px;height:64px;filter:drop-shadow(0 0 8px #4FA3FF) drop-shadow(0 0 16px #7A5CFF);z-index:3}
.spark svg{width:100%;height:100%}
#sp1{left:calc(300px - 32px);top:62px;position:fixed}
#sp2{right:6px;top:34px;position:fixed;width:52px;height:52px}
#sp3{left:calc(300px - 32px);bottom:20px;position:fixed;width:56px;height:56px}

@media(max-width:1180px){.row3{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:2px solid var(--line2)}.row3,.row2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}.spark{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="star" viewBox="0 0 100 100">
      <path d="M50 0 L56 44 L100 50 L56 56 L50 100 L44 56 L0 50 L44 44 Z" fill="#fff"/>
      <path d="M50 18 L53 47 L82 50 L53 53 L50 82 L47 53 L18 50 L47 47 Z" fill="#6FA8FF"/>
    </symbol>
  </defs>
</svg>
<div class="spark" id="sp1"><svg><use href="#star"/></svg></div>
<div class="spark" id="sp2"><svg><use href="#star"/></svg></div>
<div class="spark" id="sp3"><svg><use href="#star"/></svg></div>

<div class="topbar">
  <div class="logo">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FA3FF"/><stop offset="1" stop-color="#A56CFF"/></linearGradient></defs>
      <circle cx="24" cy="24" r="15" fill="#0B0F2A" stroke="url(#lg)" stroke-width="2.5"/>
      <ellipse cx="24" cy="24" rx="22" ry="7" fill="none" stroke="url(#lg)" stroke-width="2" transform="rotate(-25 24 24)"/>
      <polyline points="10,25 18,25 21,16 26,33 30,22 33,25 38,25" fill="none" stroke="#6EF2FF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <span>PulseMon</span>
  </div>
  <div class="right"><span id="clock"></span><span id="conn" class="pill"><i class="dot"></i><span>연결 중…</span></span></div>
</div>
<div class="app">
  <aside class="side">
    <h3>장비 목록 <span id="side-count"></span></h3>
    <input id="q" type="search" placeholder="검색" aria-label="장비 이름 검색">
    <div id="side-list"></div>
  </aside>
  <main>
    <section class="row3">
      <div class="card"><div class="ch">장비 상태 요약</div><div class="cb" id="w-state"></div></div>
      <div class="card"><div class="ch">CPU 사용률 Top 5</div><div class="cb topn" id="w-cpu"></div></div>
      <div class="card"><div class="ch">메모리 사용률 Top 5</div><div class="cb topn" id="w-mem"></div></div>
    </section>

    <section class="card sel-card">
      <div class="ch"><span id="sel-title">선택 장비</span><small>최근 60초 기준</small></div>
      <div class="cb"><div class="kpis" id="kpis"></div></div>
    </section>

    <section class="row2">
      <div class="card"><div class="ch">CPU 추이<small>점선: 경고 80%</small></div><div class="chart-box" id="c-cpu"></div></div>
      <div class="card"><div class="ch">메모리 추이<small>최근 60초</small></div><div class="chart-box" id="c-mem"></div></div>
    </section>

    <section class="card">
      <div class="ch">알람 이력<small id="alert-count"></small></div>
      <div class="scroll" id="t-alert"></div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const OFFLINE_MS = 10000, WARN = 80, HISTORY = 60;
const C = {cpu:'#B26BFF', mem:'#FFB066', ok:'#5CFF9D', warn:'#FF5C7A', bad:'#FF5C7A', off:'#7A7F8C', grid:'#1B2747', sub:'#9FB0D0', ink:'#EAF2FF', ring:'#6C4CFF'};
const devices = new Map(), history = new Map();
let alerts = [], selected = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = (o, k) => { if (!o) return undefined; const key = Object.keys(o).find(x => x.toLowerCase() === k.toLowerCase()); return key === undefined ? undefined : o[key]; };
const parseUtc = s => new Date(/(Z|[+-]\d\d:?\d\d)$/i.test(s) ? s : s + 'Z');
const stamp = d => d.toLocaleString('ko-KR', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
const pct = v => Math.max(0, Math.min(100, v));

async function api(path) { const r = await fetch(path, {cache:'no-store'}); if (!r.ok) throw new Error(r.status); return r.json(); }
async function loadDevices() {
  const list = await api('/api/devices');
  devices.clear();
  for (const d of list) devices.set(pick(d, 'deviceName'), {cpu:+pick(d, 'cpu'), memory:+pick(d, 'memory'), lastSeen:parseUtc(pick(d, 'lastSeen'))});
  if (!selected || !devices.has(selected)) selected = [...devices.keys()].sort()[0] ?? null;
}
async function loadHistory(name) {
  if (!name) return;
  const data = await api('/api/devices/' + encodeURIComponent(name) + '/history?limit=' + HISTORY);
  history.set(name, data.map(h => ({cpu:+pick(h, 'cpu'), memory:+pick(h, 'memory')})));
}
async function loadAlerts() {
  const data = await api('/api/alerts?limit=20');
  alerts = data.map(a => ({name:pick(a, 'deviceName'), value:+pick(a, 'value'), threshold:+pick(a, 'threshold'), at:parseUtc(pick(a, 'timestampUtc'))}));
}
async function refresh() {
  try { await loadDevices(); await Promise.all([loadAlerts(), loadHistory(selected)]); } catch (e) { console.warn(e); }
  render();
}

const statusOf = d => (Date.now() - d.lastSeen > OFFLINE_MS) ? 'offline' : (d.cpu >= WARN ? 'warn' : 'ok');
const bar = (v, color) => `<div class="bar"><i style="width:${pct(v)}%;background:${color};box-shadow:0 0 8px ${color}"></i></div>`;

function donut(ok, warn, off) {
  const total = ok + warn + off, r = 46, L = 2 * Math.PI * r;
  let acc = 0;
  const seg = (n, color) => { if (!n) return ''; const len = L * n / total; const s = `<circle r="${r}" cx="60" cy="60" fill="none" stroke="${color}" stroke-width="12" stroke-dasharray="${len} ${L - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)" style="filter:drop-shadow(0 0 4px ${color})"/>`; acc += len; return s; };
  const ring = total ? seg(ok, C.ring) + seg(warn, C.warn) + seg(off, C.off) : `<circle r="${r}" cx="60" cy="60" fill="none" stroke="${C.ring}" stroke-width="12" opacity=".5"/>`;
  return `<svg viewBox="0 0 120 120" style="width:140px;flex:none" role="img" aria-label="장비 상태 비율">${ring}<text x="60" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">${total}</text><text x="60" y="76" text-anchor="middle" font-size="12" fill="${C.sub}">전체 장비</text></svg>`;
}

function renderSide() {
  const q = $('#q').value.trim().toLowerCase();
  const names = [...devices.keys()].sort().filter(n => n.toLowerCase().includes(q));
  $('#side-count').textContent = devices.size + '대';
  $('#side-list').innerHTML = names.map(n => { const d = devices.get(n), st = statusOf(d), on = n === selected;
    return `<div class="item ${st} ${on ? 'sel' : ''}" data-name="${esc(n)}">${on ? '<span class="star">★</span>' : `<i class="dot st-${st}"></i>`}<span class="n" title="${esc(n)}">${esc(n)}</span><span class="p">${d.cpu.toFixed(0)}%</span></div>`; }).join('')
    || '<div class="empty">장비가 없습니다</div>';
}

function renderWidgets() {
  const all = [...devices.entries()];
  const counts = {ok:0, warn:0, offline:0};
  all.forEach(([, d]) => counts[statusOf(d)]++);
  $('#w-state').innerHTML = `<div class="donut">${donut(counts.ok, counts.warn, counts.offline)}<div class="lg">
    <div><i class="dot" style="background:${C.ring};box-shadow:0 0 6px ${C.ring}"></i>정상<b>${counts.ok}</b></div>
    <div><i class="dot st-warn"></i>경고 (${WARN}%↑)<b>${counts.warn}</b></div>
    <div><i class="dot st-offline"></i>오프라인<b>${counts.offline}</b></div>
    <div class="al">알람 (최근 20건)<b>${alerts.length}건</b></div></div></div>`;
  const online = all.filter(([, d]) => statusOf(d) !== 'offline');
  const top = (key, color, warn) => {
    const list = online.slice().sort((a, b) => b[1][key] - a[1][key]).slice(0, 5);
    return list.length ? list.map(([n, d]) => `<div class="t" data-name="${esc(n)}"><span title="${esc(n)}">${esc(n)}</span>${bar(d[key], warn && d[key] >= WARN ? C.bad : color)}<span>${d[key].toFixed(1)}</span></div>`).join('') : '<div class="empty">데이터 없음</div>';
  };
  $('#w-cpu').innerHTML = top('cpu', C.cpu, true);
  $('#w-mem').innerHTML = top('memory', C.mem, false);
}

function renderKpis() {
  $('#sel-title').textContent = selected ? '선택 장비 • ' + selected : '선택 장비';
  const d = selected && devices.get(selected), h = selected ? (history.get(selected) || []) : [];
  if (!d) { $('#kpis').innerHTML = '<div class="empty" style="grid-column:1/-1">장비를 선택해 주세요</div>'; return; }
  const avg = h.length ? h.reduce((s, p) => s + p.cpu, 0) / h.length : d.cpu;
  const k = (l, v) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  $('#kpis').innerHTML = k('현재 CPU', d.cpu.toFixed(1) + '%') + k('현재 메모리', d.memory.toFixed(1) + '%') + k('CPU 60초 평균', avg.toFixed(1) + '%');
}

function area(key, color, threshold) {
  const pts = selected ? (history.get(selected) || []) : [];
  if (!pts.length) return '<div class="empty">표시할 데이터가 없습니다.</div>';
  const W = 560, H = 220, L = 40, R = 10, T = 12, B = 28, iw = W - L - R, ih = H - T - B, off = HISTORY - pts.length;
  const x = i => L + (i + off) * iw / (HISTORY - 1), y = v => T + ih * (1 - pct(v) / 100);
  const xy = pts.map((p, i) => x(i).toFixed(1) + ',' + y(p[key]).toFixed(1));
  let grid = '';
  for (const v of [0, 25, 50, 75, 100]) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${C.grid}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="14" fill="${C.sub}">${v}</text>`;
  const last = pts[pts.length - 1];
  const th = threshold ? `<line x1="${L}" x2="${W - R}" y1="${y(WARN)}" y2="${y(WARN)}" stroke="${C.bad}" stroke-dasharray="5 4" stroke-width="1.2"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${key} 최근 60초 그래프">${grid}${th}
    <polygon points="${x(0).toFixed(1)},${y(0)} ${xy.join(' ')} ${x(pts.length - 1).toFixed(1)},${y(0)}" fill="${color}" fill-opacity=".18"/>
    <polyline fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="${xy.join(' ')}" style="filter:drop-shadow(0 0 4px ${color})"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(last[key])}" r="4.5" fill="${color}"/>
    <text x="${L}" y="${H - 5}" font-size="14" fill="${C.sub}">60초 전</text>
    <text x="${W - R}" y="${H - 5}" text-anchor="end" font-size="14" fill="${C.sub}">현재 ${last[key].toFixed(1)}%</text></svg>`;
}

function renderAlerts() {
  $('#alert-count').textContent = alerts.length ? '최근 ' + alerts.length + '건' : '';
  $('#t-alert').innerHTML = alerts.length ? `<table><thead><tr><th>시각</th><th>장비</th><th>종류</th><th class="num">값 / 임계</th></tr></thead><tbody>${alerts.map(a =>
    `<tr><td>${stamp(a.at)}</td><td><b>${esc(a.name)}</b></td><td><span class="tag">CPU</span></td><td class="num">${a.value.toFixed(1)}% / ${a.threshold}%</td></tr>`).join('')}</tbody></table>` : '<div class="empty">알람이 없습니다.</div>';
}

function render() {
  renderSide(); renderWidgets(); renderKpis();
  $('#c-cpu').innerHTML = area('cpu', C.cpu, true);
  $('#c-mem').innerHTML = area('memory', C.mem, false);
  renderAlerts();
  $('#clock').textContent = new Date().toLocaleTimeString('ko-KR', {hour12:false});
}
let pending = false;
const schedule = () => { if (pending) return; pending = true; setTimeout(() => { pending = false; render(); }, 250); };

function onMetric(m) {
  const name = pick(m, 'deviceName'), cpu = +pick(m, 'cpu'), memory = +pick(m, 'memory');
  devices.set(name, {cpu, memory, lastSeen:new Date()});
  const h = history.get(name) || [];
  h.push({cpu, memory}); if (h.length > HISTORY) h.shift();
  history.set(name, h);
  if (!selected) selected = name;
  schedule();
}
function onAlert(a) {
  alerts.unshift({name:pick(a, 'deviceName'), value:+pick(a, 'value'), threshold:+pick(a, 'threshold'), at:parseUtc(pick(a, 'timestampUtc'))});
  alerts = alerts.slice(0, 20);
  schedule();
}
function setStatus(s) {
  const el = $('#conn');
  el.className = 'pill ' + s;
  el.querySelector('span').textContent = {live:'실시간 연결됨', retry:'재연결 중…', off:'연결 끊김', poll:'폴링 모드 (2초)'}[s];
}
async function connect() {
  if (typeof signalR === 'undefined') { setStatus('poll'); setInterval(refresh, 2000); return; }
  const c = new signalR.HubConnectionBuilder().withUrl('/hub/monitor').withAutomaticReconnect([0, 1000, 2000, 5000, 10000]).build();
  c.on('MetricReceived', onMetric);
  c.on('AlertRaised', onAlert);
  c.onreconnecting(() => setStatus('retry'));
  c.onreconnected(async () => { setStatus('live'); await refresh(); });
  c.onclose(() => { setStatus('off'); setTimeout(connect, 3000); });
  try { await c.start(); setStatus('live'); } catch { setStatus('off'); setTimeout(connect, 3000); }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-name]');
  if (!el) return;
  selected = el.dataset.name;
  render();
  try { await loadHistory(selected); } catch (err) { console.warn(err); }
  render();
});
$('#q').addEventListener('input', renderSide);
setInterval(render, 1000);
refresh().then(connect);
</script>
</body>
</html>
